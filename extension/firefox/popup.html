<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA 6 Notifier</title><link rel="stylesheet" href="popup.css"></head><body><main>
<header><img class="logo" src="icon.png" alt="GTA 6 Notifier"><div><h1>GTA 6 Notifier</h1><p data-i18n="tagline"></p></div></header>
<section class="status"><span class="dot" id="dot"></span><div><strong id="status"></strong><small id="lastCheck"></small></div></section>
<div class="summary"><b data-i18n="reposSummary"></b><small data-i18n="noRest"></small></div>
<label class="toggle"><span data-i18n="monitoring"></span><input id="enabled" type="checkbox"></label>
<label><span data-i18n="interval"></span><select id="interval"><option value="1" data-i18n="minute1"></option><option value="2" data-i18n="minute2"></option><option value="5" data-i18n="minute5"></option><option value="15" data-i18n="minute15"></option></select></label>
<section class="discord"><h2 data-i18n="discordTitle"></h2><label class="toggle"><span data-i18n="discordAll"></span><input id="discordEnabled" type="checkbox"></label><label><span data-i18n="webhook"></span><input id="webhookUrl" type="password" data-i18n-placeholder="webhookPlaceholder"></label><small data-i18n="webhookHelp"></small></section>
<div class="buttons"><button id="openDashboard" class="secondary" data-i18n="dashboard"></button><button id="save" data-i18n="save"></button><button class="secondary" id="testDiscord" data-i18n="testDiscord"></button><button class="secondary" id="testNotification" data-i18n="testNotification"></button><button class="secondary" id="check" data-i18n="checkNow"></button></div>
<p id="feedback" role="status"></p>
<h2 class="repoTitle" data-i18n="githubTitle"></h2><p class="repoHint">Open the dashboard to view all discovered repositories and pending projects.</p>
<h2 class="repoTitle" data-i18n="portTitle"></h2><p class="note" data-i18n="portNote"></p>
<p class="note" data-i18n="technicalNote"></p>
<footer class="credit">GTA 6 Notifier v1.0.0 · Made by <a href="https://github.com/Nicknrss" target="_blank" rel="noreferrer">Nicknrss</a> · <a href="https://github.com/Nicknrss/GTA-6-Notifier" target="_blank" rel="noreferrer">GitHub</a></footer>
</main><script src="locale.js"></script><script src="popup.js"></script></body></html>

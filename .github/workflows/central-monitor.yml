name: GTA 6 Notifier — Central Monitor

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta6-notifier-central-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run central monitor
        run: python scripts/monitor.py

      - name: Commit updated central data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No central data changes to commit."
          else
            git commit -m "chore(data): update central monitoring history [skip ci]"
            git push
          fi

      - name: Dispatch mobile Push notifications (optional)
        env:
          PUSH_WORKER_URL: ${{ vars.PUSH_WORKER_URL }}
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
        run: |
          if [ -z "$PUSH_WORKER_URL" ] || [ -z "$PUSH_DISPATCH_SECRET" ]; then
            echo "Cloudflare Push is not configured yet; skipping dispatch."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$PUSH_WORKER_URL/dispatch" \
            -H "Authorization: Bearer $PUSH_DISPATCH_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'

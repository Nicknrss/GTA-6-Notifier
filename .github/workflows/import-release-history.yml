name: GTA 6 Notifier — One-time Release History Import

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta6-notifier-history-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import all public Releases (server-side only)
        env:
          GH_HISTORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/import_release_history.py
      - name: Commit central history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github-releases.json data/history.json
          git commit -m 'data: import complete historical GitHub Releases' || echo 'No changes to commit.'
          git push
